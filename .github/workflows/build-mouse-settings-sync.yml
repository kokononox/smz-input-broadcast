name: Build SMZ Mouse Settings Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/mouse-settings-sync/**"
      - ".github/workflows/build-mouse-settings-sync.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows app
        run: dotnet publish tools/mouse-settings-sync/SmzMouseSettingsSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/SMZ-Mouse-Settings-Sync-win-x64
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SMZ-Mouse-Settings-Sync-win-x64
          path: artifacts/SMZ-Mouse-Settings-Sync-win-x64/SmzMouseSettingsSync.exe
          if-no-files-found: error
          retention-days: 14
