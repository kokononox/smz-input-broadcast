name: Build native mirror master test firmware

on:
  workflow_dispatch:
  push:
    branches: [feat/native-mirror-master-test]
    paths:
      - "firmware/native_mirror_master_test/**"
      - ".github/workflows/build-native-mirror-master-test.yml"

permissions:
  contents: read

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Check out Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - name: Configure Pico SDK path
        run: echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> "$GITHUB_ENV"
      - name: Build compatible test master
        run: |
          cmake -S firmware/native_mirror_master_test -B build/native-mirror-master -G Ninja -DPICO_BOARD=pico
          cmake --build build/native-mirror-master --parallel 2
      - name: Upload test UF2
        uses: actions/upload-artifact@v4
        with:
          name: SMZ-Native-Mirror-Master-Test-UF2
          path: build/native-mirror-master/smz_native_mirror_master_test.uf2
          if-no-files-found: error
          retention-days: 14
