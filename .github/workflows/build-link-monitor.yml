name: Build SMZ Link Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/link-monitor/**"
      - ".github/workflows/build-link-monitor.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows app
        run: dotnet publish tools/link-monitor/SmzLinkMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/SMZ-Link-Monitor-win-x64
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SMZ-Link-Monitor-win-x64
          path: artifacts/SMZ-Link-Monitor-win-x64/SmzLinkMonitor.exe
          if-no-files-found: error
          retention-days: 14
