name: Build host bridge test firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/event_transport_test/**"
      - ".github/workflows/build-host-bridge-test.yml"

permissions:
  contents: read

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Check out Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev cmake ninja-build
      - name: Configure Pico SDK path
        run: echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> "$GITHUB_ENV"
      - name: Build HOST_MASTER firmware
        run: |
          cmake -S firmware/event_transport_test -B build/host-master -G Ninja -DPICO_BOARD=pico -DEVENT_TEST_ROLE=HOST_MASTER
          cmake --build build/host-master --parallel 2
      - name: Build CLIENT firmware
        run: |
          cmake -S firmware/event_transport_test -B build/event-client -G Ninja -DPICO_BOARD=pico -DEVENT_TEST_ROLE=CLIENT
          cmake --build build/event-client --parallel 2
      - name: Upload host bridge test UF2 files
        uses: actions/upload-artifact@v4
        with:
          name: SMZ-Host-Bridge-Test-UF2
          path: |
            build/host-master/smz_event_transport_test.uf2
            build/event-client/smz_event_transport_test.uf2
          if-no-files-found: error
          retention-days: 14
